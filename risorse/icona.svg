<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- DANEEL: R. Daneel Olivaw in cromo. Un occhio solo è rosso: quello live. -->
  <defs>
    <linearGradient id="cromo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".38" stop-color="#b9b7b2"/>
      <stop offset=".5" stop-color="#4a4946"/>
      <stop offset=".62" stop-color="#d9d7d2"/>
      <stop offset="1" stop-color="#7d7b77"/>
    </linearGradient>
    <linearGradient id="riflesso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rec" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset=".45" stop-color="#ff2a1a"/>
      <stop offset="1" stop-color="#8c0e05"/>
    </radialGradient>
    <filter id="alone" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#000"/>

  <g transform="rotate(-6 512 540)">
    <!-- antenna -->
    <rect x="498" y="150" width="28" height="120" rx="14" fill="url(#cromo)"/>
    <circle cx="512" cy="146" r="34" fill="url(#cromo)"/>
    <!-- orecchie -->
    <rect x="168" y="430" width="70" height="200" rx="30" fill="url(#cromo)"/>
    <rect x="786" y="430" width="70" height="200" rx="30" fill="url(#cromo)"/>
    <!-- testa -->
    <rect x="218" y="250" width="588" height="560" rx="150" fill="url(#cromo)"/>
    <rect x="218" y="250" width="588" height="560" rx="150" fill="url(#riflesso)"/>
    <!-- visiera -->
    <rect x="278" y="390" width="468" height="200" rx="100" fill="#000"/>
    <!-- occhio spento e occhio live -->
    <circle cx="398" cy="490" r="46" fill="#e8e6e1"/>
    <circle cx="626" cy="490" r="62" fill="#ff2a1a" filter="url(#alone)" opacity=".9"/>
    <circle cx="626" cy="490" r="52" fill="url(#rec)"/>
    <circle cx="608" cy="470" r="13" fill="#fff" opacity=".8"/>
    <!-- sorriso a griglia, storto -->
    <path d="M360 660 Q512 760 664 650" fill="none" stroke="#000" stroke-width="30" stroke-linecap="round"/>
    <g stroke="#000" stroke-width="12" stroke-linecap="round">
      <line x1="430" y1="690" x2="426" y2="722"/>
      <line x1="512" y1="704" x2="512" y2="738"/>
      <line x1="594" y1="686" x2="598" y2="718"/>
    </g>
  </g>
</svg>
