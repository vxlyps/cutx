<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' data:; media-src 'self'"
    />
    <title>CUTX</title>
    <link rel="stylesheet" href="./stile.css" />
  </head>
  <body>
    <header class="barra">
      <div class="marchio">
        <div class="gatto-posto"><img id="gatto" class="gatto" alt="" /></div>
        <img id="wordmark" class="wordmark" alt="CUTX" />
        <div id="insegna" class="insegna led">TECNOLOGIA CANAGLIA</div>
      </div>
      <button id="stash" class="key" title="Scegli lo stash">
        <span class="lbl">stash</span><span id="stash-nome">nessuno</span><i id="stash-dove"></i>
      </button>
      <div class="spazio"></div>
      <div class="tempo">
        <div class="valore"><span id="bpm" class="numero">–</span><span class="lbl">bpm</span></div>
        <div id="battute" class="battute" aria-label="Battuta">
          <div></div>
          <div></div>
          <div></div>
          <div></div>
        </div>
        <button id="frase" class="frase" title="Frase da capo al prossimo ciclo · ⌘0">
          <span id="frase-numero" class="numero">–</span><span id="frase-lunghezza" class="lbl">/16</span>
        </button>
        <span id="tempo-set" class="lbl tempo-set" title="Tempo del set">–:–</span>
      </div>
      <div class="spazio"></div>
      <button id="cuffia-onoff" class="key on" title="Cuffia on / off · ⌘K">cuffia <i>on</i></button>
      <button class="key" disabled title="Arriva in fase 3">hydra <i>off</i></button>
      <button class="key" disabled title="Arriva in fase 3">proiettore <i>off</i></button>
      <button id="apri-impostazioni" class="key" aria-label="Impostazioni" title="Impostazioni · ⌘,">⚙ <i>⌘,</i></button>
    </header>

    <main class="postazione">
      <aside class="browser">
        <nav class="schede" aria-label="Pannello">
          <button class="key on" data-scheda="suoni">suoni</button>
          <button class="key" data-scheda="libreria">libreria</button>
          <button class="key" data-scheda="help">help?</button>
        </nav>
        <div class="cerca">
          <input id="cerca" type="text" placeholder="cerca nello stash" aria-label="Cerca nello stash" spellcheck="false" />
        </div>
        <div id="elenco" class="elenco"></div>
      </aside>

      <section class="colonna cue" aria-label="CUE">
        <div class="testa">
          <span class="titolo">CUE</span>
          <span class="lbl">in cuffia</span>
          <div class="spazio"></div>
          <button class="key" disabled title="Arriva al passo 4">brano <i>–</i></button>
          <button class="key on">libero</button>
        </div>
        <div class="corpo">
          <article id="card-libero" class="card">
            <div class="card-testa">
              <span class="nome">libero</span>
              <span id="libero-stato" class="lbl">pronta</span>
              <div class="spazio"></div>
              <button id="manda-cuffia" class="key">cuffia <i>⌘↵</i></button>
              <button id="manda-live" class="key">go live <i>⇧⌘↵</i></button>
            </div>
            <div id="editor" class="editor"></div>
            <p id="errore-codice" class="errore"></p>
          </article>
        </div>
        <div class="piede">
          <span class="lbl">entra tra</span>
          <button class="key on" disabled title="Entrata a tempo: arriva al passo 5">1</button>
          <button class="key" disabled title="Arriva al passo 5">2</button>
          <button class="key" disabled title="Arriva al passo 5">4</button>
          <button class="key" disabled title="Arriva al passo 5">8</button>
          <span class="lbl">cicli</span>
          <div class="spazio"></div>
          <button id="go-live" class="key acid grande">GO LIVE <i>⇧⌘↵</i></button>
        </div>
      </section>

      <section id="colonna-live" class="colonna live" aria-label="LIVE">
        <div class="testa">
          <span class="titolo">LIVE</span>
          <span class="lbl">casse + proiettore</span>
        </div>
        <div id="livelli" class="corpo"></div>
        <div class="piede">
          <span id="piede-frase" class="lbl">frase –</span>
          <div id="quarti" class="quarti" aria-label="Quarto">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
          <span id="tempo-live" class="lbl tempo-set"></span>
          <span id="conteggio" class="lbl">0 live</span>
        </div>
      </section>
    </main>

    <!-- Provvisorio: al passo 9 diventano le impostazioni vere (sezione audio). -->
    <div id="impostazioni" class="impostazioni" hidden>
      <div class="pannello">
        <div class="testa">
          <span class="titolo">IMPOSTAZIONI</span>
          <span class="lbl">audio e test</span>
          <div class="spazio"></div>
          <button id="chiudi-impostazioni" class="key">chiudi <i>esc</i></button>
        </div>
        <div class="sezioni">
          <section class="blocco">
            <h2 class="lbl">uscite</h2>
            <label>live <select id="uscita-live"></select></label>
            <label>cuffia <select id="uscita-cuffia"></select></label>
            <label>offset cuffia (ms) <input id="offset-cuffia" type="number" step="0.5" value="0" /></label>
            <label>lunghezza frase
              <select id="lunghezza-frase"><option>8</option><option>16</option><option>32</option></select>
            </label>
            <p id="errore-uscite" class="errore"></p>
            <h2 class="lbl">suoni nello stash</h2>
            <p id="suoni" class="secondario"></p>
          </section>

          <section class="blocco">
            <h2 class="lbl">test sfasamento</h2>
            <div class="fila">
              <button id="test-avvia" class="key">avvia test</button>
              <button id="test-ferma" class="key">ferma</button>
            </div>
            <table id="misure">
              <tr><th></th><th>ultimo</th><th>media</th><th>min</th><th>max</th><th>deriva</th></tr>
              <tr id="riga-stima"><td>stima</td></tr>
              <tr id="riga-vero"><td>anello</td></tr>
            </table>
            <p id="verdetto" class="verdetto"></p>
            <p id="durata" class="secondario"></p>
            <label>ingresso anello <select id="ingresso-anello"></select></label>
            <div class="fila">
              <button id="anello-attiva" class="key">ascolta ingresso</button>
              <button id="anello-riferimento" class="key">salva riferimento</button>
            </div>
            <p id="anello-stato" class="secondario"></p>
          </section>

          <section class="blocco">
            <h2 class="lbl">robustezza</h2>
            <div class="fila">
              <button id="cuffia-blocca" class="key">blocca cuffia 5 s</button>
              <button id="cuffia-crasha" class="key">crasha cuffia</button>
            </div>
            <div class="fila">
              <button id="ui-blocca" class="key">blocca interfaccia 5 s</button>
              <button id="ui-crasha" class="key">crasha interfaccia</button>
            </div>
            <p id="motori-dettagli" class="secondario a-capo"></p>
            <p id="percorso-log" class="secondario"></p>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
