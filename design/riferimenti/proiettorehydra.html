<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>CUTX proiettore con Hydra</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Canaglia Stencil';src:url(../risorse/font/CanagliaStencil.woff2) format('woff2')}
.gatto{filter:drop-shadow(0 0 6px rgba(159,194,58,.55))}
.glow{text-shadow:0 0 12px rgba(159,194,58,.6)}
.led{background-color:#0A0D06;background-image:radial-gradient(#1A2010 1px, transparent 1.4px);background-size:4px 4px}
body{margin:0;background:#050604}
.pc{font-family:'Fragment Mono',monospace;font-size:40px;line-height:1.3;white-space:pre;color:#D9DCCC;background: #050604;padding:4px 10px;display:inline-block}
.hot{background:#9FC23A;color:#0B0F03}
.tag{font-family:'Fragment Mono',monospace;font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:#9FC23A;background: #050604;padding:2px 10px;align-self:flex-start}
.dith1{background-image:radial-gradient(#9FC23A 1.2px, transparent 1.6px);background-size:6px 6px}
.dith2{background-image:radial-gradient(#9FC23A 2px, transparent 2.6px);background-size:9px 9px}
.dith3{background-image:radial-gradient(#D9DCCC 1px, transparent 1.4px);background-size:4px 4px}
</style>
</helmet>
<div style="width: 1440px; height: 810px; background: #050604; position: relative; overflow: hidden; color: #D9DCCC">
<div aria-hidden="true" style="position: absolute; inset: 0">
<div class="dith1" style="position: absolute; left: 0; top: 0; width: 520px; height: 810px; opacity: 0.55"></div>
<div class="dith2" style="position: absolute; left: 560px; top: 120px; width: 880px; height: 300px; opacity: 0.35"></div>
<div class="dith3" style="position: absolute; left: 380px; top: 470px; width: 1060px; height: 220px; opacity: 0.4"></div>
<div style="position: absolute; left: 520px; top: 0; width: 6px; height: 810px; background: #9FC23A"></div>
</div>
<div style="position: absolute; right: 40px; top: 40px; font-family: 'Fragment Mono', monospace; font-size: 14px; letter-spacing: 0.14em; color: #0B0F03; background: #9FC23A; padding: 4px 10px">[ I TUOI 16MM · HYDRA ]</div>
<div style="position: absolute; left: 64px; top: 120px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">● intro</span><div class="pc">s("<span class="hot">bd</span>*4, ~ hh").bank("909")</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">● melodia</span><div class="pc">n("0 3 <span class="hot">7</span> &lt;10 12&gt;").scale("C:minor")</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="tag">● basso</span><div class="pc">note("&lt;c1 c1 <span class="hot">eb1</span> g0&gt;*8").s("supersaw")</div></div>
</div>
<div style="position: absolute; right: 64px; bottom: 38px; font-family: 'Canaglia Stencil', 'Fragment Mono', monospace; font-weight: 400; font-size: 168px; line-height: 1; color: #9FC23A; background: #050604; padding: 0 12px" class="glow">38</div>
<sc-if value="{{logo}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 64px; bottom: 44px; display: flex; align-items: center; gap: 16px"><img class="gatto" src="../risorse/gatti/gatto_seduto_logo_marcio.svg" alt="" style="height: 64px; width: auto; background: #050604; padding: 6px"><img src="../risorse/logo/cutx_bianco.svg" alt="CUTX" style=" background: #050604; padding: 6px 12px; height: 40px; width: auto"><div class="led glow" style="font-family: 'Canaglia Stencil', 'Fragment Mono', monospace; font-size: 20px; letter-spacing: 0.06em; color: #9FC23A; padding: 8px 12px; border: 1px solid #1F2614; border-radius: 3px; white-space: nowrap">TECNOLOGIA CANAGLIA</div></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"logo":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  renderVals() {
    return { logo: this.props.logo ?? true };
  }
}
</script>
</body>
</html>
